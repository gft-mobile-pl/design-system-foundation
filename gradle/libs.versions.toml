[versions]
# Build toolchain
kotlin = "2.4.21"
maven-publish = "0.37.0"

# Code generation
ksp = "2.3.14"
kotlinpoet = "2.4.0"

# Multiplatform libraries
jetbrains-compose = "1.12.2"
concurrency = "1.0.0"

[libraries]

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrains-compose" }

# Code generation
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlin-poet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# Multiplatform concurrency
concurrency = { module = "com.gft.mobile:concurrency", version.ref = "concurrency" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
